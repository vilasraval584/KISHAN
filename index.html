  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #17201d 0%, #080a0a 45%, #030404 100%);
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: auto;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 0;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border: 1px solid #20ff88;
      border-radius: 30px;
      color: #20ff88;
      font-size: 13px;
      margin-bottom: 22px;
      background: rgba(32,255,136,.06);
    }

    h1 {
      font-size: clamp(42px, 8vw, 82px);
      line-height: 1;
      font-weight: 900;
      background: linear-gradient(90deg,#20ff88,#7dffcb,#20ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 22px;
    }

    .hero p {
      max-width: 650px;
      margin: auto;
      color: #b8c0bd;
      font-size: 18px;
      line-height: 1.7;
    }

    .telegram-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 32px;
      padding: 17px 32px;
      border-radius: 50px;
      background: linear-gradient(135deg,#20ff88,#0bdc72);
      color: #03120a;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 0 35px rgba(32,255,136,.25);
      transition: .25s ease;
    }

    .telegram-btn:hover {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 0 50px rgba(32,255,136,.45);
    }

    .section {
      padding: 80px 0;
    }

    .section-title {
      text-align: center;
      font-size: 34px;
      margin-bottom: 40px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 20px;
    }

    .card {
      background: rgba(255,255,255,.045);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 22px;
      padding: 30px;
      text-align: center;
      backdrop-filter: blur(12px);
      transition: .25s ease;
    }

    .card:hover {
      transform: translateY(-6px);
      border-color: rgba(32,255,136,.4);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 18px;
    }

    .card h3 {
      margin-bottom: 12px;
      font-size: 21px;
    }

    .card p {
      color: #aeb7b3;
      line-height: 1.6;
      font-size: 15px;
    }

    .cta {
      text-align: center;
      padding: 80px 25px;
      margin: 30px 0 70px;
      border-radius: 30px;
      background: linear-gradient(
        135deg,
        rgba(32,255,136,.10),
        rgba(100,70,255,.08)
      );
      border: 1px solid rgba(255,255,255,.08);
    }
